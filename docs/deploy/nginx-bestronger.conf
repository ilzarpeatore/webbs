# /etc/nginx/sites-available/bestronger.es
#
# Reverse proxy de Nginx (en el host, fuera de Docker) hacia el contenedor
# Next.js, que solo escucha en 127.0.0.1:3000. Copiar a
# /etc/nginx/sites-available/, symlink en sites-enabled/ y luego correr
# `certbot --nginx -d bestronger.es -d www.bestronger.es` (ver DEPLOY.md) --
# certbot reescribe automáticamente el bloque 443 con las rutas de los
# certificados.

server {
    listen 80;
    listen [::]:80;
    server_name bestronger.es www.bestronger.es;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
